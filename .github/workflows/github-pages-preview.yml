name: Publish static Preview to GitHub Pages

on:
  push:
    branches:
      - deploy/github-pages-preview
    paths:
      - "docs/**"
      - ".github/workflows/github-pages-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static preview
        run: |
          test -s docs/index.html
          grep -q '<html lang="ar" dir="rtl">' docs/index.html
          grep -q 'لا تداول' docs/index.html
          if grep -Eiq 'password|api[_-]?key|secret|private[_-]?key' docs/index.html; then
            echo "Unexpected credential-like field found in public static page."
            exit 1
          fi
      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
