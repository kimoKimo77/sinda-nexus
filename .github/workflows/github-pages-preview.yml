name: Validate and optionally publish static Preview

on:
  pull_request:
    branches:
      - deploy/github-pages-preview
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "Publish publicly to GitHub Pages (requires Pages to be enabled)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static preview
        run: |
          set -euo pipefail
          test -s docs/index.html
          grep -q '<html lang="ar" dir="rtl">' docs/index.html
          grep -q 'لا تداول' docs/index.html
          if grep -Eiq 'password|api[_-]?key|secret|private[_-]?key' docs/index.html; then
            echo "Unexpected credential-like field found in public static page."
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pages }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check that GitHub Pages is enabled
        id: pages-check
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.notice('GitHub Pages is not enabled/configured for this repository. Skipping public deployment; enable Pages in Settings > Pages and rerun with publish_pages=true.');
                core.setOutput('enabled', 'false');
              } else {
                throw error;
              }
            }
      - name: Configure GitHub Pages
        if: ${{ steps.pages-check.outputs.enabled == 'true' }}
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        if: ${{ steps.pages-check.outputs.enabled == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
