name: API checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "feat/initial-node-api"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Run syntax checks and tests
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
